name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

# Publishing is NOT auto-dispatched: runs triggered by github-actions[bot]
# fail both registries (JSR actorNotScopeMember, npm OIDC denied — verified
# on v0.1.0 and v0.2.0). After merging a release PR, run:
#   gh workflow run release.yml -f tag_name=vX.Y.Z
