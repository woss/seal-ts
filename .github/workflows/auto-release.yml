name: Auto Release

# Zero-touch releases through the branch-protection rules (main: PR-only +
# verified signatures — direct pushes and API commits are both rejected, so
# release-please's pattern applies):
#
# 1. Every merge to main runs scripts/auto-release.mjs. Ordinary pushes get a
#    bump commit on a disposable chore/release-vX.Y.Z branch; this workflow
#    then opens/updates the release PR with gh + GITHUB_TOKEN (a bot may open
#    PRs). Merging the release PR lands a GitHub-signed commit on main,
#    satisfying the signature rule.
# 2. When the release PR is merged (main's version ahead of the last v* tag),
#    the script cuts the annotated tag and pushes it as a HUMAN actor — JSR
#    trusted publishing rejects bot tokens (actorNotScopeMember). The tag
#    push triggers release.yml (gates + npm/JSR publish).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PAT }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - name: Compute release (bump commit on release branch, or tag after PR merge)
        run: node scripts/auto-release.mjs
      - name: Open or update the release PR
        # .release-pr.json is written only in release-PR mode (tag mode tags
        # and publishes directly).
        if: hashFiles('.release-pr.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(jq -r .branch .release-pr.json)
          title=$(jq -r .title .release-pr.json)
          jq -r .body .release-pr.json > .release-body.md
          gh pr create --head "$branch" --title "$title" --body-file .release-body.md ||
            gh pr edit "$branch" --title "$title" --body-file .release-body.md
